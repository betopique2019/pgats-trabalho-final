name: Testes Cypress

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7

      - name: Configurar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.0'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Executar os testes no Chrome
        run: npm test

      - name: Disponibilizar relatorio e capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cypress
          path: |
            cypress/reports/
            cypress/screenshots/
          if-no-files-found: warn
          retention-days: 30